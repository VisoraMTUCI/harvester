# Полное локальное окружение: go-сервис + Kafka + Zookeeper + Kafka UI.
services:
  harvester:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: harvester:local
    container_name: ${COMPOSE_PROJECT_NAME:-harvester}
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${HTTP_SERVER_PORT:-8080}:${HTTP_SERVER_PORT:-8080}"
      - "${DEBUG_SERVER_PORT:-8084}:${DEBUG_SERVER_PORT:-8084}"
    depends_on:
      kafka:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: kafka-topics --bootstrap-server kafka:9092 --list
      interval: 10s
      timeout: 10s
      retries: 10
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_HOST_PORT:-9092}:${KAFKA_CONTAINER_PORT:-9092}"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "${KAFKA_UI_HOST_PORT:-8081}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:${KAFKA_CONTAINER_PORT:-9092}
    depends_on:
      kafka:
        condition: service_healthy
